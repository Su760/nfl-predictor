name: Private redundant NFL due check

on:
  schedule:
    - cron: "14 0 7 9 *"
    - cron: "19 0 7 9 *"
    - cron: "24 0 7 9 *"
    - cron: "29 0 7 9 *"
    - cron: "14 23 9 9 *"
    - cron: "19 23 9 9 *"
    - cron: "24 23 9 9 *"
    - cron: "29 23 9 9 *"
  workflow_dispatch:
    inputs:
      at:
        description: Current UTC timestamp for an in-window recovery
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: nfl-odds-budget-2026-09
  cancel-in-progress: false

jobs:
  private-due:
    if: ${{ vars.NFL_V2_DEPLOYMENT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NFL_PREDICTOR_DATA_DIR: data
    steps:
      - name: Check out private ledger
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: data
      - name: Freeze UTC scheduler clock
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_AT: ${{ inputs.at }}
        run: |
          run_started_at_utc="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          run_at_utc="$run_started_at_utc"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            run_at_utc="$REQUESTED_AT"
          fi
          printf 'RUN_STARTED_AT_UTC=%s\n' "$run_started_at_utc" >> "$GITHUB_ENV"
          printf 'RUN_AT_UTC=%s\n' "$run_at_utc" >> "$GITHUB_ENV"
      - name: Validate private due configuration
        id: config
        shell: bash
        env:
          CURRENT_REPOSITORY: ${{ github.repository }}
          CONFIGURED_PUBLIC_REPOSITORY: ${{ vars.NFL_PUBLIC_REPOSITORY }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          root = Path("data")
          config = tomllib.loads((root / "config/data_repo.toml").read_text())
          manifest_path = root / config["schedule"]["manifest_path"]
          manifest_raw = manifest_path.read_bytes()
          manifest = json.loads(manifest_raw)
          manifest_sha = hashlib.sha256(manifest_raw).hexdigest()
          if not config["deployment_enabled"] or not manifest["deployment_enabled"]:
              raise SystemExit("deployment is disabled")
          if config["authorization"]["target_private_repository"] != os.environ["CURRENT_REPOSITORY"]:
              raise SystemExit("private repository is not the authorized target")
          if config["authorization"]["source_public_repository"] != os.environ["CONFIGURED_PUBLIC_REPOSITORY"]:
              raise SystemExit("configured public repository is not authorized")
          if manifest_sha != config["schedule"]["manifest_sha256"]:
              raise SystemExit("schedule manifest hash mismatch")
          if (
              not config["schedule"]["generated_from_active_event_versions"]
              or not manifest["generated_from_active_event_versions"]
          ):
              raise SystemExit("active event-version schedule is absent")
          if not config["schedule"]["active_event_version_manifest_sha256"]:
              raise SystemExit("active event-version manifest hash is absent")
          if (
              manifest["active_event_version_manifest_sha256"]
              != config["schedule"]["active_event_version_manifest_sha256"]
          ):
              raise SystemExit("active event-version manifest hash mismatch")
          if os.environ["RUN_STARTED_AT_UTC"][:7] != config["month_lock"]:
              raise SystemExit("workflow month is outside the reviewed month lock")
          code_sha = config["authorization"]["approved_public_code_sha"]
          if not re.fullmatch(r"[0-9a-f]{40}", code_sha):
              raise SystemExit("approved public code SHA is absent or malformed")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write("code_sha=" + code_sha + "\n")
          PY
      - name: Check out exact approved public SHA
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ vars.NFL_PUBLIC_REPOSITORY }}
          ref: ${{ steps.config.outputs.code_sha }}
          path: code
          persist-credentials: false
      - name: Install locked Python 3.11
        # astral-sh/setup-uv v8.1.0
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.11"
          enable-cache: false
      - name: Restore frozen public environment
        working-directory: code
        shell: bash
        run: uv sync --frozen
      - name: Run readiness gate
        working-directory: code
        shell: bash
        run: uv run python -m nfl_predictor.cli readiness check --as-of "$RUN_AT_UTC"
      - name: Reserve monthly odds budget
        working-directory: code
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path("../data/config/data_repo.toml").read_text())
          projection = config["cost_projection"]
          job_fields = (
              ("private_due_ticks", "private_due_seconds_each"),
              ("full_forecast_workers", "full_forecast_seconds_each"),
              ("settlement_jobs", "settlement_seconds_each"),
              ("correction_jobs", "correction_seconds_each"),
              ("retry_allowance", "retry_seconds_each"),
          )
          billed_minutes = sum(
              projection[count] * ((projection[seconds] + 59) // 60)
              for count, seconds in job_fields
          )
          paid_actions = max(
              0,
              billed_minutes - projection["verified_included_private_actions_minutes"],
          )
          paid_storage = max(
              0,
              projection["projected_storage_bytes"]
              - projection["verified_included_storage_bytes"],
          )
          if billed_minutes != projection["projected_github_billed_minutes"]:
              raise SystemExit("stored Actions projection does not match per-job rounding")
          if paid_actions != projection["projected_paid_actions_minutes"]:
              raise SystemExit("stored paid Actions projection is inconsistent")
          if paid_storage != projection["projected_paid_storage_bytes"]:
              raise SystemExit("stored paid storage projection is inconsistent")
          if paid_actions != 0:
              raise SystemExit("projected paid Actions usage is nonzero")
          if paid_storage != 0:
              raise SystemExit("projected paid storage is nonzero")
          root = Path("../data") / config["ledger"]["budget_reservation_directory"]
          root.mkdir(parents=True, exist_ok=True)
          destination = root / ("private-" + os.environ["GITHUB_RUN_ID"] + ".json")
          descriptor = os.open(destination, os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o600)
          with os.fdopen(descriptor, "w", encoding="utf-8") as handle:
              json.dump(
                  {"month": config["month_lock"], "run_id": os.environ["GITHUB_RUN_ID"]},
                  handle,
                  sort_keys=True,
              )
              handle.write("\n")
          PY
          uv run python -m nfl_predictor.cli odds budget-plan --season 2026
      - name: Run idempotent private due forecast
        working-directory: code
        shell: bash
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          echo "::add-mask::${ODDS_API_KEY}"
          uv run python -m nfl_predictor.cli forecast due \
            --at "$RUN_AT_UTC" --trigger private_schedule
      - name: Scan ledger for secret leakage
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          patterns = (
              re.compile(rb"ODDS_API_KEY\s*[:=]"),
              re.compile(rb"(?:github_pat_|ghp_)[A-Za-z0-9_]{20,}"),
              re.compile(rb"api[_-]?key\s*[:=]\s*[A-Za-z0-9_-]{16,}", re.IGNORECASE),
          )
          for root_name in ("ledger", "raw", "reports"):
              root = Path("data") / root_name
              if not root.exists():
                  continue
              for path in root.rglob("*"):
                  if path.is_file() and any(
                      pattern.search(path.read_bytes()) for pattern in patterns
                  ):
                      raise SystemExit("possible secret material in " + str(path))
          PY
      - name: Validate immutable ledger
        shell: bash
        run: |
          git -C data diff --check
          if git -C data diff --name-only --diff-filter=DM | grep -q .; then
            echo "existing immutable file changed or deleted" >&2
            exit 1
          fi
          python - <<'PY'
          import subprocess

          allowed = ("ledger/", "raw/", "reports/")
          output = subprocess.check_output(
              ["git", "-C", "data", "status", "--porcelain"], text=True
          )
          for line in output.splitlines():
              path = line[3:]
              if not path.startswith(allowed):
                  raise SystemExit("write outside immutable append roots: " + path)
          PY
      - name: Push immutable ledger append
        shell: bash
        run: |
          for append_root in ledger raw reports; do
            if [ -e "data/${append_root}" ]; then
              git -C data add -- "$append_root"
            fi
          done
          if git -C data diff --cached --quiet; then
            exit 0
          fi
          git -C data config user.name "nfl-v2-automation"
          git -C data config user.email "nfl-v2-automation@users.noreply.github.com"
          git -C data commit -m "data: append immutable private due forecast"
          git -C data push origin HEAD
