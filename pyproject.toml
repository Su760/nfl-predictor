[project]
name = "nfl-predictor-v2"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "duckdb>=1.5,<2",
  "httpx>=0.28,<1",
  "joblib>=1.5,<2",
  "nflreadpy==0.1.5",
  "numpy>=2,<3",
  "polars>=1,<2",
  "pyarrow>=21,<22",
  "pydantic>=2.13,<3",
  "scikit-learn>=1.7,<2",
]

[project.scripts]
nfl-predictor = "nfl_predictor.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6,<7",
  "mypy>=1.18,<2",
  "pytest>=8,<9",
  "pytest-cov>=7,<8",
  "pyyaml>=6,<7",
  "ruff>=0.13,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nfl_predictor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["nfl_predictor"]
